<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capsule Rank</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script defer src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Motiva Sans", system-ui, Arial, sans-serif; background: #1b2838; color: #c7d5e0; }
    .topbar, .editor, .grid-section { max-width: 1000px; margin-left: auto; margin-right: auto; }
    h1, h2, h3 { font-weight: 400; }
    a, .link { color: #66c0f4; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .topbar { padding: 1.5rem 2rem .5rem; text-align: center; }
    .topbar h1 { margin: 0; color: white; font-size: 28px; text-transform: uppercase; letter-spacing: .08em; }
    .tagline { color: #8f98a0; margin: .25rem 0 0; }

    /* ===== Editor ===== */
    .editor { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 2rem; padding: 1rem 2rem; }
    .editor-visuals { display: flex; flex-direction: column; gap: 1rem; }
    .capsule-preview { display: block; width: 460px; max-width: 100%; aspect-ratio: 460 / 215; background: #2a3f5a; border: 2px dashed #4a6a8a; border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; transition: border-color 100ms linear, background 100ms linear; }
    .capsule-preview:hover { border-color: #66c0f4; }
    .capsule-preview.has-image { border: 1px solid #66c0f4; }
    .capsule-preview.drag-active { border-color: #66c0f4; background: #2a475e; }
    .capsule-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .capsule-preview .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; text-align: center; color: #b0bcc6; padding: 1rem; line-height: 1.3; pointer-events: none; }
    .capsule-preview .placeholder svg { width: 36px; height: 36px; color: #66c0f4; opacity: .8; margin-bottom: .15rem; }
    .capsule-preview .placeholder strong { font-weight: 600; font-size: 14px; color: #c7d5e0; }
    .capsule-preview .placeholder small { font-size: 12px; color: #8f98a0; }
    .preview-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
    .icon-btn { background: rgba(0,0,0,.6); border: 0; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; transition: background 100ms linear; }
    .icon-btn:hover { background: rgba(0,0,0,.85); color: #66c0f4; }
    .icon-btn svg { width: 14px; height: 14px; display: block; }
    .capsule-library { display: flex; gap: .35rem; width: 460px; max-width: 100%; overflow-x: auto; padding: .35rem 0; scrollbar-width: thin; }
    .capsule-thumb { position: relative; flex: 0 0 auto; width: 92px; aspect-ratio: 460 / 215; background: #2a3f5a; border: 2px solid transparent; border-radius: 3px; overflow: hidden; cursor: pointer; }
    .capsule-thumb.active { border-color: #66c0f4; }
    .capsule-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .capsule-thumb .remove-x { position: absolute; top: 1px; right: 1px; background: rgba(0,0,0,.7); color: white; border: 0; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; line-height: 1; font-size: 13px; opacity: 0; transition: opacity 100ms linear; }
    .capsule-thumb:hover .remove-x { opacity: 1; }
    .capsule-thumb.add-thumb { border: 2px dashed #4a6a8a; display: grid; place-items: center; cursor: pointer; }
    .capsule-thumb.add-thumb span { color: #8f98a0; font-size: 22px; line-height: 1; }
    .capsule-thumb.add-thumb:hover { border-color: #66c0f4; }
    .warn-severe { color: #e35b5b; margin: .25rem 0; }
    .screenshot-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; max-width: 460px; }
    .screenshot-slot { position: relative; aspect-ratio: 16 / 9; background: #2a3f5a; border: 1px dashed #4a6a8a; border-radius: 3px; overflow: hidden; cursor: pointer; display: grid; place-items: center; }
    .screenshot-slot.has-image { border-style: solid; border-color: #66c0f4; }
    .screenshot-slot img { width: 100%; height: 100%; object-fit: cover; }
    .screenshot-slot .placeholder { color: #8f98a0; font-size: 12px; }
    .screenshot-slot .remove-x { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); color: white; border: 0; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; line-height: 1; }

    .editor-fields .field { display: block; margin-bottom: .85rem; }
    .editor-fields .field > span { display: block; font-size: 12px; color: #8f98a0; margin-bottom: .25rem; }
    .editor-fields input[type="text"],
    .editor-fields input[type="number"],
    .editor-fields input[type="date"],
    .editor-fields select {
      background: #2a3f5a; color: #c7d5e0; border: 1px solid #4a6a8a; border-radius: 3px;
      padding: .4rem .55rem; width: 100%; max-width: 320px; font: inherit;
    }
    .editor-fields .tag-input {
      display: flex; flex-wrap: wrap; gap: .35rem; padding: .4rem;
      background: #2a3f5a; border: 1px solid #4a6a8a; border-radius: 3px; max-width: 460px;
    }
    .editor-fields .tag-input input { background: transparent; border: 0; flex: 1; min-width: 8rem; color: inherit; padding: .15rem .25rem; outline: none; }
    .tag-pill { display: inline-flex; align-items: center; gap: .25rem; background: #4a6a8a; color: #c7d5e0; border-radius: 2px; padding: .15rem .4rem; font-size: 12px; }
    .tag-pill button { background: transparent; border: 0; color: inherit; cursor: pointer; padding: 0; line-height: 1; font-size: 14px; }
    details.advanced { margin-top: 1rem; }
    details.advanced summary { cursor: pointer; color: #66c0f4; font-weight: 600; padding: .35rem 0; user-select: none; }
    details.advanced[open] summary { margin-bottom: .5rem; }
    .platforms-row label { display: inline-flex; align-items: center; gap: .25rem; margin-right: .75rem; font-size: 13px; }
    .clear-link { display: block; margin-top: 1rem; }

    /* ===== Grid ===== */
    .grid-section { padding: 2rem 2rem 4rem; border-top: 1px solid rgba(102, 192, 245, .15); margin-top: 1rem; }
    .grid-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .75rem; }
    .grid-header h2 { color: white; margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: .05em; }
    .refresh-btn { display: inline-flex; align-items: center; gap: .4rem; background: linear-gradient(to bottom, #67c1f5, #417a9b); color: white; border: 0; padding: .5rem 1rem; border-radius: 2px; cursor: pointer; font: inherit; }
    .refresh-btn svg { width: 14px; height: 14px; display: block; }
    .refresh-btn:hover { background: linear-gradient(to bottom, #7cd1ff, #4f8aae); }
    .empty-prompt { color: #b0bcc6; padding: .5rem 0; }
    .grid-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: .75rem; align-items: start; position: relative; }
    .grid-rows { list-style: none; margin: 0; padding: 0; }
    .row {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr) auto auto auto;
      gap: .65rem;
      align-items: center;
      padding: .5rem;
      background: linear-gradient(to right, #16202d, #1b2838);
      border-bottom: 1px solid #0f1822;
      cursor: pointer;
      transition: background 80ms linear;
    }
    .row.active { background: linear-gradient(to right, #4f87b8 0%, #5d9ac8 100%); }
    .row.active .row-name { color: white; }
    .row.active .row-tags, .row.active .row-date { color: rgba(27, 40, 56, .85); }
    .row-capsule { width: 140px; aspect-ratio: 460 / 215; overflow: hidden; background: #0e141b; }
    .row-capsule img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row-meta { min-width: 0; }
    .row-name { color: #c7d5e0; font-size: 17px; line-height: 1.2; margin-bottom: .25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-platforms { display: flex; gap: .25rem; margin-bottom: .25rem; }
    .plat { display: inline-block; width: 14px; height: 14px; background: rgba(255,255,255,.2); border-radius: 2px; }
    .plat.win, .plat.mac {
      background: center/contain no-repeat;
      border-radius: 0;
      /* Source PNGs are pure black; tint to a neutral gray that reads on both
         the dark default row and the lighter active-row gradient. */
      filter: invert(72%);
    }
    .plat.win { background-image: url("windows.png"); }
    .plat.mac { background-image: url("mac.png"); }
    .row-tags { color: #8f98a0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
    .row-price-block { display: flex; align-items: stretch; gap: 0; }
    .discount-badge {
      background: #4c6b22; color: #beee11; font-weight: bold;
      padding: .35rem .55rem; border-radius: 2px 0 0 2px; font-size: 14px;
      display: flex; align-items: center;
    }
    .price-stack { background: rgba(0,0,0,.2); padding: .25rem .55rem; min-width: 70px; text-align: right; border-radius: 0 2px 2px 0; }
    .price-stack.no-discount { background: transparent; padding-right: 0; }
    .price-original { color: #738895; font-size: 11px; text-decoration: line-through; line-height: 1.1; }
    .price-final { color: white; font-size: 13px; line-height: 1.1; }
    .price-final.is-discounted { color: #beee11; }
    .row-date { color: #8f98a0; font-size: 12px; min-width: 80px; text-align: right; padding-right: .35rem; }

    /* ===== Sidebar ===== */
    .sidebar {
      background: linear-gradient(to bottom, #c4dbed 0%, #b6d2eb 100%);
      padding: 1rem; min-height: 500px; color: #1b2838;
    }
    .sidebar-name { margin: 0 0 .75rem; color: #1b2838; font-size: 22px; font-weight: 400; }
    .review-block { background: #4f87b8; padding: .5rem .75rem; border-radius: 2px; margin-bottom: .75rem; }
    .review-header { color: white; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; margin-bottom: .15rem; }
    .review-summary { font-size: 13px; }
    .review-label { color: #66c0f4; font-weight: 600; }
    .review-count { color: white; margin-left: .35rem; opacity: .85; }
    .sidebar-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .85rem; }
    .sidebar-tag-pill { background: rgba(103, 193, 245, .35); color: #1b2838; border-radius: 2px; padding: .15rem .55rem; font-size: 12px; }
    .sidebar-screenshots { display: flex; flex-direction: column; gap: .5rem; }
    .sidebar-screenshots img { width: 100%; height: auto; display: block; border-radius: 2px; background: #0e141b; }
    .no-shots { color: rgba(27, 40, 56, .65); font-style: italic; }

    /* ===== Crop modal ===== */
    [x-cloak] { display: none !important; }
    .crop-modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; overflow: auto; }
    .crop-modal-inner { display: flex; flex-direction: column; align-items: center; min-width: min-content; }
    .crop-hint { color: #c7d5e0; margin: 0 0 .75rem; font-size: 13px; text-align: center; }
    .crop-stage { width: 460px; height: 215px; flex-shrink: 0; background: #000; overflow: hidden; position: relative; cursor: grab; touch-action: none; border: 1px solid #66c0f4; }
    .crop-stage:active { cursor: grabbing; }
    .crop-stage img { position: absolute; top: 0; left: 0; user-select: none; -webkit-user-drag: none; pointer-events: none; max-width: none; }
    .crop-actions { display: flex; gap: .75rem; margin-top: 1rem; }
    .crop-actions button { padding: .5rem 1.25rem; background: #2a475e; border: 1px solid #4a6a8a; color: #c7d5e0; border-radius: 3px; cursor: pointer; font: inherit; }
    .crop-actions button.primary { background: linear-gradient(to bottom, #67c1f5, #417a9b); color: white; border: 0; }
    .crop-actions button.primary:hover { background: linear-gradient(to bottom, #7cd1ff, #4f8aae); }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .editor { grid-template-columns: minmax(0, 1fr); padding: 1rem; gap: 1rem; }
      .grid-section { padding: 1rem; }
      .grid-layout { grid-template-columns: minmax(0, 1fr); }
      .row {
        grid-template-columns: 130px 1fr;
        grid-template-rows: auto auto auto;
        gap: .35rem .75rem;
      }
      .row-capsule { width: 130px; grid-row: span 3; }
      .row-meta { grid-column: 2; }
      .row-price-block { grid-column: 2; justify-self: start; }
      .row-date { grid-column: 2; text-align: left; font-size: 11px; padding: 0; }

      /* Mobile: hide the default-position sidebar; show only when explicitly opened. */
      .sidebar { display: none; }
      .sidebar.mobile-open {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        z-index: 50;
        margin: 0;
        min-height: 0;
        box-shadow: 0 12px 24px rgba(0, 0, 0, .55);
        border: 1px solid #4a6a8a;
      }
    }

    /* ===== Edit-games modal ===== */
    .grid-actions { display: flex; gap: .5rem; }

    .edit-games-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); z-index: 110; display: flex; align-items: flex-start; justify-content: center; padding: 4rem 1rem 1rem; overflow: auto; }
    .edit-games-inner { background: #1b2838; color: #c7d5e0; border: 1px solid #2a475e; border-radius: 4px; width: 100%; max-width: 560px; max-height: calc(100vh - 6rem); display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0, 0, 0, .6); }
    .edit-games-header { display: flex; align-items: center; justify-content: space-between; padding: .85rem 1rem; border-bottom: 1px solid #2a475e; }
    .edit-games-header h3 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: .05em; color: white; }
    .edit-games-close { background: transparent; border: 0; color: #8f98a0; font-size: 20px; line-height: 1; cursor: pointer; padding: .25rem .5rem; border-radius: 2px; }
    .edit-games-close:hover { background: rgba(255, 255, 255, .08); color: white; }

    .search-wrap { position: relative; padding: .85rem 1rem; }
    .search-bar { position: relative; display: flex; align-items: center; background: #0e141b; border: 1px solid #2a475e; border-radius: 3px; transition: border-color .12s ease; }
    .search-bar:focus-within { border-color: #67c1f5; }
    .search-bar input { flex: 1; min-width: 0; background: transparent; border: 0; color: #c7d5e0; font: inherit; padding: .55rem .75rem .55rem 2.1rem; outline: none; }
    .search-bar input::placeholder { color: #6b7d8d; }
    /* Hide the browser's native search-clear glyph; the custom one below handles clearing. */
    .search-bar input[type="search"]::-webkit-search-cancel-button,
    .search-bar input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
    .search-bar .search-icon { position: absolute; left: .65rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #6b7d8d; pointer-events: none; }
    .search-clear { background: transparent; border: 0; color: #8f98a0; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 .65rem; height: 100%; }
    .search-clear:hover { color: white; }

    .search-dropdown { position: absolute; left: 1rem; right: 1rem; top: calc(100% - .35rem); background: #0e141b; border: 1px solid #2a475e; border-top: 0; border-radius: 0 0 3px 3px; max-height: 320px; overflow-y: auto; z-index: 1; box-shadow: 0 12px 24px rgba(0, 0, 0, .45); }
    .search-result { display: flex; align-items: center; gap: .65rem; width: 100%; background: transparent; border: 0; padding: .4rem .65rem; cursor: pointer; color: #c7d5e0; text-align: left; font: inherit; border-bottom: 1px solid rgba(255, 255, 255, .04); }
    .search-result:last-child { border-bottom: 0; }
    .search-result.highlighted { background: #1b3550; outline: none; }
    .search-result img { width: 76px; height: 35.5px; object-fit: cover; flex-shrink: 0; background: #0e141b; border-radius: 1px; }
    .search-result > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .search-result.adding { opacity: .55; cursor: progress; }
    .search-result .row-spinner { width: 14px; height: 14px; flex-shrink: 0; }
    .search-result .result-check { width: 16px; height: 16px; flex-shrink: 0; color: #6cd14f; }
    .search-empty, .search-message { padding: .65rem 1rem; color: #8f98a0; font-size: 13px; }
    .search-message.error { color: #ff7878; }

    .spinner { display: inline-block; width: 14px; height: 14px; color: #67c1f5; animation: spin .8s linear infinite; }
    .spinner circle { opacity: .25; }
    .spinner .spinner-arc { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-loading { display: flex; align-items: center; gap: .5rem; padding: .65rem 1rem; color: #8f98a0; font-size: 13px; }

    .rotation-list { padding: .25rem 1rem 1rem; overflow-y: auto; flex: 1; min-height: 0; }
    .rotation-list-header { display: flex; align-items: baseline; justify-content: space-between; padding: .35rem .15rem; color: #8f98a0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .rotation-row { display: flex; align-items: center; gap: .65rem; padding: .35rem .15rem; border-bottom: 1px solid rgba(255, 255, 255, .04); }
    .rotation-row img { width: 76px; height: 35.5px; object-fit: cover; flex-shrink: 0; background: #0e141b; border-radius: 1px; }
    .rotation-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .rotation-trash { background: transparent; border: 0; color: #6b7d8d; cursor: pointer; padding: .25rem .4rem; border-radius: 2px; }
    .rotation-trash:hover { color: #ff7878; background: rgba(255, 120, 120, .08); }
    .rotation-trash svg { width: 16px; height: 16px; display: block; }
    .rotation-empty { padding: 1rem .15rem; color: #8f98a0; font-size: 13px; }
  </style>
</head>
<body x-data="capsuleRankApp" x-init="init()">
  <header class="topbar">
    <h1>Capsule Rank</h1>
    <p class="tagline">Drop your Steam header capsule into a New &amp; Trending mock and see if it stands out.</p>
  </header>

  <main>
  <section class="editor" aria-label="Editor">
    <div class="editor-visuals">
      <label class="capsule-preview"
             :class="{ 'has-image': userGame.capsule, 'drag-active': dragActive }"
             title="Click or drop a capsule image"
             @dragover.prevent="dragActive = true"
             @dragenter.prevent="dragActive = true"
             @dragleave.self="dragActive = false"
             @drop.prevent="onCapsuleDropped($event)">
        <template x-if="userGame.capsule">
          <img :src="userGame.capsule" alt="Active capsule">
        </template>
        <template x-if="!userGame.capsule">
          <span class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M17 8l-5-5-5 5"/>
              <path d="M12 3v12"/>
            </svg>
            <strong>Drop a capsule or click to upload</strong>
            <small>460 × 215 — Steam header capsule</small>
          </span>
        </template>
        <input type="file" accept="image/*" class="visually-hidden" @change="onCapsuleSelected($event)">
        <template x-if="userGame.capsule">
          <div class="preview-actions">
            <button type="button" class="icon-btn" @click.prevent.stop="recropActive()" aria-label="Re-crop" title="Re-crop">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 1v11h11"/>
                <path d="M1 4h11v11"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" @click.prevent.stop="clearCapsule()" aria-label="Deselect" title="Deselect">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M3 3l10 10M13 3L3 13"/>
              </svg>
            </button>
          </div>
        </template>
      </label>

      <div class="capsule-library">
        <label class="capsule-thumb add-thumb" title="Upload a new capsule">
          <span>+</span>
          <input type="file" accept="image/*" class="visually-hidden" @change="onCapsuleSelected($event)">
        </label>
        <template x-for="cap in capsuleLibrary" :key="cap.id">
          <div class="capsule-thumb"
               :class="{ active: userGame.activeCapsuleId === cap.id }"
               @click="selectCapsule(cap)"
               title="Click to select; hover × to delete">
            <img :src="cap.dataUrl" alt="">
            <button type="button" class="remove-x" @click.stop="deleteCapsule(cap)" aria-label="Delete capsule">×</button>
          </div>
        </template>
      </div>

    </div>

    <div class="editor-fields">
      <label class="field">
        <span>Game name</span>
        <input type="text" x-model="userGame.name" placeholder="My Game">
      </label>

      <details class="advanced">
        <summary>Advanced</summary>

        <div class="field">
          <span>Screenshots (up to 4)</span>
          <div class="screenshot-slots">
            <template x-for="i in 4" :key="i">
              <label class="screenshot-slot" :class="{ 'has-image': userGame.screenshots[i-1] }">
                <template x-if="userGame.screenshots[i-1]">
                  <img :src="userGame.screenshots[i-1]" alt="">
                </template>
                <template x-if="!userGame.screenshots[i-1]">
                  <span class="placeholder">+ add</span>
                </template>
                <input type="file" accept="image/*" class="visually-hidden" @change="onScreenshotSelected($event, i-1)">
                <button type="button" class="remove-x" x-show="userGame.screenshots[i-1]" @click.prevent="removeScreenshot(i-1)" aria-label="Remove screenshot">×</button>
              </label>
            </template>
          </div>
        </div>

        <div class="field">
          <span>Tags</span>
          <div class="tag-input">
            <template x-for="tag in userGame.tags" :key="tag">
              <span class="tag-pill">
                <span x-text="tag"></span>
                <button type="button" @click="removeTag(tag)" aria-label="Remove tag">×</button>
              </span>
            </template>
            <input type="text"
                   placeholder="Type a tag, press Enter"
                   @keydown.enter.prevent="addTag($event.target.value); $event.target.value = ''">
          </div>
        </div>

        <label class="field">
          <span>Price (USD)</span>
          <input type="number" min="0" step="0.01"
                 :value="(userGame.price / 100).toFixed(2)"
                 @input="userGame.price = Math.round(parseFloat($event.target.value || 0) * 100)">
        </label>

        <label class="field">
          <span>Discount %</span>
          <input type="number" min="0" max="95" step="1" x-model.number="userGame.discountPct">
        </label>

        <label class="field">
          <span>Review summary</span>
          <select x-model="userGame.reviewSummary">
            <option>Overwhelmingly Positive</option>
            <option>Very Positive</option>
            <option>Positive</option>
            <option>Mostly Positive</option>
            <option>Mixed</option>
            <option>Mostly Negative</option>
            <option>Negative</option>
            <option>Very Negative</option>
            <option>Overwhelmingly Negative</option>
          </select>
        </label>

        <label class="field">
          <span>Review count</span>
          <input type="number" min="0" step="1" x-model.number="userGame.reviewCount">
        </label>

        <div class="field platforms-row">
          <span>Platforms</span>
          <label><input type="checkbox" :checked="userGame.platforms.includes('windows')" @change="togglePlatform('windows')"> Windows</label>
          <label><input type="checkbox" :checked="userGame.platforms.includes('mac')" @change="togglePlatform('mac')"> Mac</label>
          <label><input type="checkbox" :checked="userGame.platforms.includes('linux')" @change="togglePlatform('linux')"> Linux</label>
        </div>

        <label class="field">
          <span>Release date</span>
          <input type="date" x-model="userGame.releaseDate">
        </label>
      </details>

      <p class="warn-severe" x-show="storageWarning" x-text="storageWarning"></p>

      <button type="button" class="link clear-link" @click="if (confirm('Clear all editor data?')) clearAll()">Clear</button>
    </div>
  </section>

  <section class="grid-section" aria-label="Grid">
    <div class="grid-header">
      <h2>New &amp; Trending</h2>
      <div class="grid-actions">
        <button type="button" class="refresh-btn" @click="openEditGames()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
          Edit games
        </button>
        <button type="button" class="refresh-btn" @click="refresh()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3h5v5"/>
            <path d="M4 20L21 3"/>
            <path d="M21 16v5h-5"/>
            <path d="M15 15l6 6"/>
            <path d="M4 4l5 5"/>
          </svg>
          Shuffle
        </button>
      </div>
    </div>
    <p class="warn-severe" x-show="loadError" x-text="loadError"></p>
    <p class="empty-prompt" x-show="!userGame.capsule && !loadError">Upload a capsule above to drop yours in.</p>

    <div class="grid-layout">
      <ol class="grid-rows">
        <template x-for="row in displayedRows" :key="row.key">
          <li class="row"
              :class="{ active: activeRowKey === row.key }"
              @mouseenter="if (!isMobile) activeRowKey = row.key"
              @click="onRowClick(row.key, $event)">
            <div class="row-capsule">
              <img :src="capsuleUrl(row)" alt="" width="460" height="215" loading="lazy" decoding="async" @error="onCapsuleImageError(row)">
            </div>
            <div class="row-meta">
              <div class="row-name" x-text="row.name"></div>
              <div class="row-platforms">
                <template x-if="row.platforms?.includes('windows')"><span class="plat win" title="Windows"></span></template>
                <template x-if="row.platforms?.includes('mac')"><span class="plat mac" title="Mac"></span></template>
              </div>
              <div class="row-tags" x-text="(row.tags || []).join(', ')"></div>
            </div>
            <template x-if="priceFor(row).discountLabel">
              <span class="discount-badge" x-text="priceFor(row).discountLabel"></span>
            </template>
            <div class="price-stack" :class="{ 'no-discount': !priceFor(row).discountLabel }">
              <template x-if="priceFor(row).original">
                <div class="price-original" x-text="priceFor(row).original"></div>
              </template>
              <div class="price-final" :class="{ 'is-discounted': priceFor(row).discountLabel }" x-text="priceFor(row).final"></div>
            </div>
            <div class="row-date" x-text="dateFor(row)"></div>
          </li>
        </template>
      </ol>

      <aside class="sidebar"
             :class="{ 'mobile-open': isMobile && mobileSidebarOpen }"
             :style="(isMobile && mobileSidebarOpen) ? `top:${mobileSidebarTop}px` : ''">
        <template x-if="activeRow">
          <div>
            <h3 class="sidebar-name" x-text="activeRow.name || 'Untitled'"></h3>
            <div class="review-block">
              <div class="review-header">English Reviews</div>
              <div class="review-summary">
                <span class="review-label" x-text="activeRow.reviewSummary"></span>
                <span class="review-count" x-text="'(' + (activeRow.reviewCount || 0).toLocaleString() + ')'"></span>
              </div>
            </div>
            <div class="sidebar-tags">
              <template x-for="tag in activeRow.tags || []" :key="tag">
                <span class="sidebar-tag-pill" x-text="tag"></span>
              </template>
            </div>
            <div class="sidebar-screenshots">
              <template x-if="screenshotsFor(activeRow).length === 0">
                <p class="no-shots">No screenshots available.</p>
              </template>
              <template x-for="shot in screenshotsFor(activeRow)" :key="shot.key">
                <img :src="shot.src" alt="" width="600" height="338" loading="lazy" decoding="async" @error="$event.target.style.display='none'">
              </template>
            </div>
          </div>
        </template>
      </aside>
    </div>
  </section>
  </main>

  <div class="crop-modal" x-show="cropping" x-cloak>
    <div class="crop-modal-inner">
      <p class="crop-hint">Drag the image to choose what shows in the 460 × 215 capsule.</p>
      <div class="crop-stage"
           @pointerdown.prevent="startCrop($event)"
           @pointermove="dragCrop($event)"
           @pointerup="endCrop()"
           @pointercancel="endCrop()"
           @pointerleave="endCrop()">
        <img :src="cropSourceUrl"
             :style="`transform: translate(${cropOffsetX}px, ${cropOffsetY}px); width: ${cropDisplayW}px; height: ${cropDisplayH}px;`"
             draggable="false" alt="">
      </div>
      <div class="crop-actions">
        <button type="button" @click="cancelCrop()">Cancel</button>
        <button type="button" class="primary" @click="applyCrop()">Use this crop</button>
      </div>
    </div>
  </div>

  <div class="edit-games-modal"
       x-show="showEditGames"
       x-cloak
       @click.self="closeEditGames()"
       @keydown.escape.window="if (showEditGames) closeEditGames()">
    <div class="edit-games-inner">
      <div class="edit-games-header">
        <h3>Edit games</h3>
        <button type="button" class="edit-games-close" @click="closeEditGames()" aria-label="Close">×</button>
      </div>

      <div class="search-wrap" @click.outside="searchFocused = false">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="search"
                 placeholder="Search Steam to add a game…"
                 x-model="searchQuery"
                 @focus="searchFocused = true"
                 @input.debounce.300ms="onSearchInput()"
                 @keydown.down.prevent="moveHighlight(1)"
                 @keydown.up.prevent="moveHighlight(-1)"
                 @keydown.enter.prevent="addHighlighted()">
          <button type="button"
                  class="search-clear"
                  x-show="searchQuery.length > 0"
                  @mousedown.prevent
                  @click="clearSearchInput()"
                  aria-label="Clear search">×</button>
        </div>

        <div class="search-dropdown"
             x-show="searchFocused && (searchLoading || searchResults.length > 0 || searchError || (searchQuery.trim().length >= 2 && !searchLoading))"
             x-cloak>
          <template x-if="searchLoading">
            <div class="search-loading">
              <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <circle class="spinner-arc" cx="12" cy="12" r="9" stroke-dasharray="14 60" stroke-linecap="round"/>
              </svg>
              <span>Searching…</span>
            </div>
          </template>
          <template x-if="!searchLoading && searchError">
            <div class="search-message error" x-text="searchError"></div>
          </template>
          <template x-if="!searchLoading && !searchError">
            <template x-for="(item, idx) in searchResults" :key="item.appid">
              <button type="button"
                      class="search-result"
                      :class="{ adding: addingAppid === item.appid, highlighted: searchHighlight === idx }"
                      :data-idx="idx"
                      @mousedown.prevent
                      @mouseenter="searchHighlight = idx"
                      @click="toggleFromSearch(item)"
                      :disabled="addingAppid !== null">
                <img :src="item.capsule" alt="" loading="lazy" width="76" height="36">
                <span x-text="item.name"></span>
                <template x-if="addingAppid === item.appid">
                  <svg class="spinner row-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <circle class="spinner-arc" cx="12" cy="12" r="9" stroke-dasharray="14 60" stroke-linecap="round"/>
                  </svg>
                </template>
                <template x-if="addingAppid !== item.appid && isInRotation(item.appid)">
                  <svg class="result-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Already in rotation">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </template>
              </button>
            </template>
          </template>
          <template x-if="!searchLoading && !searchError && searchResults.length === 0 && searchQuery.trim().length >= 2">
            <div class="search-empty">No results.</div>
          </template>
        </div>
      </div>

      <div class="rotation-list">
        <div class="rotation-list-header">
          <span>Total</span>
          <span x-text="rotation.length"></span>
        </div>
        <template x-if="rotation.length === 0">
          <div class="rotation-empty">Your rotation is empty — search above to add games.</div>
        </template>
        <template x-for="g in rotation" :key="g.appid">
          <div class="rotation-row">
            <img :src="`https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`" alt="" loading="lazy" width="76" height="36">
            <span class="name" x-text="g.name"></span>
            <button type="button" class="rotation-trash" @click="removeFromRotation(g.appid)" :aria-label="`Remove ${g.name}`" :title="`Remove ${g.name}`">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
